<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love.css</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- الزر: مربع اختيار مخفي + label يعمل كزر -->
  <input type="checkbox" id="bloom" hidden>

  <main class="scene">
    <div class="rose">
      <div class="stem"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="flower">
        <span class="petal back back0"></span>
        <span class="petal back back1"></span>
        <span class="petal back back2"></span>
        <span class="petal back back3"></span>
        <span class="petal back back4"></span>
        <span class="petal mid mid0"></span>
        <span class="petal mid mid1"></span>
        <span class="petal mid mid2"></span>
        <span class="petal mid mid3"></span>
        <span class="petal inner inner0"></span>
        <span class="petal inner inner1"></span>
        <span class="petal inner inner2"></span>
        <span class="petal front f1"></span>
        <span class="petal front f2"></span>
        <span class="petal front f3"></span>
      </div>
    </div>

    <p class="msg">i coded this for you siwar 🌹</p>

    <label for="bloom" class="btn">
      <span class="open">TAP TO BLOOM</span>
      <span class="close">CLOSE</span>
    </label>
  </main>
</body>
</html>
